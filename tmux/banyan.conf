# banyan.conf — tmux bindings for the banyan CLI.
#
# Do NOT source this file directly. Run `bn install-tmux` once after install;
# it renders this template into ~/.config/banyan/banyan.tmux.conf with the
# correct absolute paths and prints the line to add to your ~/.tmux.conf.
#
# Bindings use `Alt+<letter>` (no prefix). On macOS, Alt == Option. The bindings
# are context-aware: they detect project/repo/feature from the current tmux
# pane's cwd via `bn whereami`, and fall back to a prompt when out of context.
#
# Why Alt instead of Cmd? macOS and your terminal emulator intercept Cmd+letter
# before tmux can see them. Alt+letter passes through cleanly.

# ──────────────────────────────────────────────────────────
# Context-aware actions (work on the feature/repo of the current pane)
# ──────────────────────────────────────────────────────────

# Alt+M  — merge current worktree (or prompt if not in one)
bind-key -n M-m run-shell \
  "__BANYAN_TMUX_DIR__/banyan-current-action.sh merge"

# Alt+C  — cleanup current worktree
bind-key -n M-c run-shell \
  "__BANYAN_TMUX_DIR__/banyan-current-action.sh cleanup"

# Alt+R  — rebase current worktree on base branch
bind-key -n M-r run-shell \
  "__BANYAN_TMUX_DIR__/banyan-current-action.sh rebase"

# Alt+T  — test current feature (all repos with worktrees)
bind-key -n M-t run-shell \
  "__BANYAN_TMUX_DIR__/banyan-current-action.sh test"

# Alt+D  — deploy current repo (or current project)
bind-key -n M-d run-shell \
  "__BANYAN_TMUX_DIR__/banyan-current-action.sh deploy"

# ──────────────────────────────────────────────────────────
# Actions that need input
# ──────────────────────────────────────────────────────────

# Alt+W  — new worktree. Asks for feature name, then optionally which repos.
bind-key -n M-w command-prompt -p "feature name:,repos (space-sep, empty = all):" \
  "run-shell '__BANYAN_TMUX_DIR__/banyan-new-worktree.sh %1 %2'"

# ──────────────────────────────────────────────────────────
# Popup views (no context needed, informational)
# ──────────────────────────────────────────────────────────

# Alt+L  — list worktrees popup
bind-key -n M-l display-popup -E -w 80% -h 60% "bn wt-ls 2>&1 | less -R"

# Alt+S  — session status popup
bind-key -n M-s display-popup -E -w 60% -h 40% "bn status 2>&1 | less -R"

# Alt+I  — project info popup
bind-key -n M-i display-popup -E -w 70% -h 60% "bn info 2>&1 | less -R"

# Alt+?  — show all banyan shortcuts in a popup
bind-key -n M-? display-popup -E -w 55% -h 60% \
  "__BANYAN_TMUX_DIR__/banyan-shortcuts-help.sh | less -R"

# (Alt+B removed — `bn sidebar` handles the split/focus itself now.)
