<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banyan dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
      .pulse-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 min-h-screen">
    <header class="border-b border-neutral-800 px-6 py-4 sticky top-0 bg-neutral-950/90 backdrop-blur z-10">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-semibold tracking-tight">
          <span class="text-emerald-400">banyan</span>
          <span class="text-neutral-500 text-sm font-normal ml-2">dashboard</span>
        </h1>
        <div class="flex items-center gap-4 text-sm">
          <span id="last-refresh" class="text-neutral-500"></span>
          <span id="status" class="flex items-center gap-2 text-neutral-400">
            <span class="pulse-dot bg-emerald-400"></span>
            <span>live</span>
          </span>
        </div>
      </div>
    </header>

    <main id="root" class="p-6 space-y-6 max-w-6xl mx-auto">
      <p class="text-neutral-500">loading…</p>
    </main>

    <div id="toast-host" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <footer class="px-6 py-4 text-xs text-neutral-600 border-t border-neutral-900 mt-8">
      auto-refresh every 2s · click the MR button to fetch status on demand
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
