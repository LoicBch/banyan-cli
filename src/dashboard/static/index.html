<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banyan dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
      .pulse-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 min-h-screen">
    <header class="border-b border-neutral-800 px-3 sm:px-6 py-3 sm:py-4 sticky top-0 bg-neutral-950/90 backdrop-blur z-10">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-3">
          <h1 class="text-base sm:text-xl font-semibold tracking-tight">
            <span class="text-emerald-400">banyan</span>
          </h1>
          <select id="project-selector"
            class="bg-neutral-900 border border-neutral-800 rounded px-2 py-1 text-sm font-mono hidden">
          </select>
        </div>
        <nav id="tabs" class="flex items-center gap-1 text-xs sm:text-sm overflow-x-auto -mx-1 px-1 order-3 sm:order-2 w-full sm:w-auto">
          <button data-tab="pipeline" class="tab-btn px-3 py-1 rounded text-neutral-300 hover:bg-neutral-800 whitespace-nowrap">Pipeline</button>
          <button data-tab="inbox" class="tab-btn px-3 py-1 rounded text-neutral-300 hover:bg-neutral-800 whitespace-nowrap">Inbox</button>
          <button data-tab="history" class="tab-btn px-3 py-1 rounded text-neutral-300 hover:bg-neutral-800 whitespace-nowrap">History</button>
          <button data-tab="ask" class="tab-btn px-3 py-1 rounded text-neutral-300 hover:bg-neutral-800 whitespace-nowrap">Ask</button>
          <button data-tab="config" class="tab-btn px-3 py-1 rounded text-neutral-300 hover:bg-neutral-800 whitespace-nowrap">Config</button>
          <button data-tab="shortcuts" class="tab-btn px-3 py-1 rounded text-neutral-300 hover:bg-neutral-800 whitespace-nowrap">Shortcuts</button>
        </nav>
        <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm order-2 sm:order-3">
          <span id="last-refresh" class="text-neutral-500 hidden sm:inline"></span>
          <span id="status" class="flex items-center gap-2 text-neutral-400">
            <span class="pulse-dot bg-emerald-400"></span>
            <span>live</span>
          </span>
        </div>
      </div>
    </header>

    <main id="root" class="p-6 space-y-6 max-w-6xl mx-auto">
      <p class="text-neutral-500">loading…</p>
    </main>

    <section id="shortcuts-root" class="p-6 space-y-6 max-w-3xl mx-auto hidden"></section>

    <section id="config-root" class="p-6 space-y-6 max-w-5xl mx-auto hidden"></section>

    <section id="ask-root" class="p-6 space-y-4 max-w-4xl mx-auto hidden"></section>

    <section id="history-root" class="p-6 space-y-4 max-w-6xl mx-auto hidden"></section>

    <section id="inbox-root" class="p-6 space-y-4 max-w-4xl mx-auto hidden"></section>

    <div id="toast-host" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <footer class="px-6 py-4 text-xs text-neutral-600 border-t border-neutral-900 mt-8">
      auto-refresh every 2s · click the MR button to fetch status on demand
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
